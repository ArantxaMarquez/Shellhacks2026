<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freeze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<div style="display: flex; align-items: center; justify-content: center; max-width: 1000px; height: 180px; margin: 0 auto 24px; background-color: #161D27; border: 1px solid #2A3441; border-radius: 10px; padding: 20px;">
  <h1 class="project-title" style="margin: 0;">Freeze</h1>
</div>
  <main>
    

    <!-- Hero: the car reacts to the confidence score -->
    

    <!-- Camera + confidence readout -->
    <section class="info">
      <div class="card card-spotlight" id="card" data-state="offline">
        <div class="thumb">
          <img id="frame" alt="Live camera view">
          <div class="thumb-off">No image</div>
        </div>

        <div class="readout">
          <div class="head">
            <span class="label">Camera confidence</span>
            <span class="badge" id="badge">Offline</span>
          </div>

          <div class="value"><span id="pct">--</span><span class="unit" id="unit"></span></div>

          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar-track">
            <div class="bar-fill" id="bar"></div>
          </div>

          <p class="caption" id="caption" aria-live="polite">Connecting to sensor…</p>
        </div>
      </div>
    </section>

    <!-- Driving scene: reacts to the same status the card above shows -->
    <section class="scene-card" id="sceneCard" data-state="offline">
      <div class="scene">
        <video class="scene-bg" id="scene-bg" src="assets/background.mp4" autoplay loop muted playsinline></video>
        <div class="scene-weather" id="scene-weather" aria-hidden="true"></div>
        <video class= "scene-road" id="scene-road" src="assets/road.MP4" autoplay loop muted playsinline></video>
        <img class="car" id="car" src="assets/car.PNG" alt="car">
        <div class="scene-banner" id="scene-banner">STOPPED — LOW VISIBILITY</div>
      </div>
    </section>
  </main>

 <footer class = "page-footer">
  <h2  style = "align-items: center;">For Contact and Support, please reach out to us at +1(641)671-6766</h2>
  <span> Freeze - built for Shellhacks 2026</span>
  <span class="dot"></span>
 </footer>
    

  <script src="app.js"></script>
</body>
</html>
